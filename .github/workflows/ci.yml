name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server + shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Order mirrors docs/technical-architecture.md §8: determinism -> lint -> typecheck -> test.
      - run: bun run lint:determinism
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  client:
    name: client (specs + production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Vitest through Angular's unit-test builder (jsdom, no browser needed).
      - run: bun run test:client
      - run: bun run build:client
