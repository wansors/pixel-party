name: CI

# The gate on every push and pull request; on develop (trunk) a green gate is also a release: a version
# bump, a tag and a multi-arch image on Docker Hub (docs/release.md).
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = minor, or major when a commit is marked breaking)
        type: choice
        options: [auto, minor, major, patch]
        default: auto

# Read-only by default; only the release job may write (its commit, tag and GitHub Release). Actions
# are pinned to commit SHAs (Dependabot keeps them current): the release job hands them secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a PR run, but never cuts a release short halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: server + shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Order mirrors docs/technical-architecture.md §8: determinism -> lint -> typecheck -> test.
      - run: bun run lint:determinism
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  client:
    name: client (specs + production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      # The Angular CLI and Vitest run on Node (Angular 22: ^22.22.3 || ^24.15), not on the runner's default.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Vitest through Angular's unit-test builder (jsdom, no browser needed).
      - run: bun run test:client
      - run: bun run build:client

  # Pull requests: prove the Dockerfile still builds (not pushed anywhere).
  image:
    name: docker image (build only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: release (version + Docker Hub)
    needs: [server, client]
    # Trunk only. It does nothing until the DOCKERHUB_TOKEN secret exists (see "Ready to release?").
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'wansors' }}
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/pixel-party', vars.DOCKERHUB_USERNAME || 'wansors') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags + history: the bump reads the commits since the last release
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Release only with Docker Hub configured, and only from the newest commit: a newer push is
      # already on its way through CI and will release everything, these commits included.
      - name: Ready to release?
        id: go
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::No DOCKERHUB_TOKEN secret yet, so no release (docs/release.md)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin develop
          if [ "$(git rev-parse origin/develop)" = "$GITHUB_SHA" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "develop has moved on; its own run releases it."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        id: version
        if: steps.go.outputs.release == 'true'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          [ "$BUMP" = "auto" ] && BUMP=""
          VERSION=$(bun scripts/release-version.ts $BUMP)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Commit, tag and push
        if: steps.go.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore(release): v$VERSION [skip ci]"
            git push origin HEAD:develop
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --target "$(git rev-parse HEAD)"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.go.outputs.release == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.go.outputs.release == 'true'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        if: steps.go.outputs.release == 'true'
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.go.outputs.release == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Docker Hub page shows docs/docker.md.
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: steps.go.outputs.release == 'true'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: LAN party mini-games in the browser — one container, every player on their own device.
          readme-filepath: docs/docker.md
