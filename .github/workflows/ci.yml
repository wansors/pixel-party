name: CI

# The gate on every push and pull request; on develop (trunk) a green gate is also a release: a version
# bump, a tag and a multi-arch image on Docker Hub (docs/release.md).
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = minor, or major when a commit is marked breaking)
        type: choice
        options: [auto, minor, major, patch]
        default: auto

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a PR run, but never cuts a release short halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: server + shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Order mirrors docs/technical-architecture.md §8: determinism -> lint -> typecheck -> test.
      - run: bun run lint:determinism
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  client:
    name: client (specs + production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Vitest through Angular's unit-test builder (jsdom, no browser needed).
      - run: bun run test:client
      - run: bun run build:client

  # Pull requests: prove the Dockerfile still builds (not pushed anywhere).
  image:
    name: docker image (build only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: release (version + Docker Hub)
    needs: [server, client]
    # Trunk only, and only once Docker Hub is configured (the DOCKERHUB_USERNAME variable).
    if: >-
      github.ref == 'refs/heads/develop' && vars.DOCKERHUB_USERNAME != '' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/pixel-party', vars.DOCKERHUB_USERNAME) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history: the bump reads the commits since the last release
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # A newer push is already on its way through CI and will release everything, these commits
      # included: this run steps aside instead of racing it.
      - name: Newest commit?
        id: head
        run: |
          git fetch origin develop
          if [ "$(git rev-parse origin/develop)" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "develop has moved on; its own run releases it."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        id: version
        if: steps.head.outputs.newest == 'true'
        run: |
          BUMP="${{ inputs.bump }}"
          [ "$BUMP" = "auto" ] && BUMP=""
          VERSION=$(bun scripts/release-version.ts $BUMP)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Commit, tag and push
        if: steps.head.outputs.newest == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore(release): v$VERSION [skip ci]"
            git push origin HEAD:develop
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --target "$(git rev-parse HEAD)"

      - uses: docker/setup-buildx-action@v4
        if: steps.head.outputs.newest == 'true'
      - uses: docker/login-action@v4
        if: steps.head.outputs.newest == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        if: steps.head.outputs.newest == 'true'
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        if: steps.head.outputs.newest == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Docker Hub page shows docs/docker.md, with the real image name filled in.
      - name: Docker Hub description
        if: steps.head.outputs.newest == 'true'
        run: sed "s#<dockerhub-user>/pixel-party#${IMAGE}#g" docs/docker.md > "$RUNNER_TEMP/dockerhub.md"
      - uses: peter-evans/dockerhub-description@v5
        if: steps.head.outputs.newest == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: LAN party mini-games in the browser — one container, every player on their own device.
          readme-filepath: ${{ runner.temp }}/dockerhub.md
